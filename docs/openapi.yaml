openapi: 3.0.3
info:
  title: AsoftechInsightz Business Suite API
  version: 1.0.0
  description: |
    API-first contract for LeadEdge360, RetailEdge360, and shared Business Suite services.
    Sprint 0 skeleton — expand per module in Sprints 1–6.

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://app.asoftechinsightz.com/api
    description: Production

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    PaginatedList:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

paths:
  /health/live:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK

  /health/ready:
    get:
      summary: Readiness probe (MongoDB ping)
      security: []
      responses:
        '200':
          description: Ready

  /auth/login-password:
    post:
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: JWT tokens issued
        '401':
          description: Invalid credentials

  /leads:
    get:
      summary: List leads (tenant-scoped)
      responses:
        '200':
          description: Lead list
    post:
      summary: Create lead
      responses:
        '201':
          description: Created

  /opportunities:
    get:
      summary: List opportunities
      responses:
        '200':
          description: OK

  /proposals:
    get:
      summary: List proposals
      responses:
        '200':
          description: OK

  /revenue/dashboard:
    get:
      summary: Revenue dashboard KPIs
      responses:
        '200':
          description: OK

  /analytics/summary:
    get:
      summary: Tenant-scoped analytics summary (Sprint 0)
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized

  /growth/business-card:
    get:
      summary: List business cards (Sprint 1)
      tags: [Growth]
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Plan or feature not allowed
    post:
      summary: Create business card (Sprint 1)
      tags: [Growth]
      responses:
        '201':
          description: Created
        '400':
          description: Validation error

  /public/card/{slug}:
    get:
      summary: Public business card JSON (Sprint 1)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public card profile

  /qr:
    get:
      summary: List QR codes (Sprint 2)
      tags: [QR]
      responses:
        '200':
          description: OK
    post:
      summary: Create QR code (Sprint 2)
      tags: [QR]
      responses:
        '201':
          description: Created

  /public/qr/{code}:
    get:
      summary: Public QR redirect + track (alias)
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to target
        '200':
          description: JSON when format=json
        '429':
          description: Rate limited

  /public/q/{code}:
    get:
      summary: Public QR redirect + track (canonical)
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to target
        '200':
          description: JSON when format=json
        '429':
          description: Rate limited

  /qr/summary:
    get:
      summary: Org QR dashboard summary (Sprint 2)
      tags: [QR]
      responses:
        '200':
          description: OK

  /qr/{id}/convert:
    post:
      summary: Record QR conversion (Sprint 2)
      tags: [QR]
      responses:
        '200':
          description: OK

  /mobile/qr:
    get:
      summary: Mobile QR list (Sprint 2)
      tags: [QR]
      responses:
        '200':
          description: OK

  /mobile/qr/scan:
    post:
      summary: Mobile QR scan (Sprint 2)
      tags: [QR]
      responses:
        '200':
          description: OK

  /mobile/qr/convert:
    post:
      summary: Mobile QR conversion (Sprint 2)
      tags: [QR]
      responses:
        '200':
          description: OK

  /users/features:
    get:
      summary: Org plan features for UI gating (Sprint 2)
      tags: [Auth]
      responses:
        '200':
          description: OK

tags:
  - name: Auth
  - name: CRM
  - name: Growth
  - name: QR
  - name: Reviews
  - name: AI
  - name: Retail

