# AsoftechInsightz — Nginx reverse-proxy config
#
# Alternative to Caddy if your stack already standardises on Nginx.
# Place at /etc/nginx/sites-available/asoftech and symlink to sites-enabled.
#
# Prerequisites:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d app.asoftechinsightz.com -d asoftechinsightz.com -d flows.asoftechinsightz.com

# ---- App + apex ----
server {
    listen 80;
    listen [::]:80;
    server_name asoftechinsightz.com app.asoftechinsightz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asoftechinsightz.com app.asoftechinsightz.com;

    # TLS cert paths managed by certbot
    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Sensible body size for file uploads
    client_max_body_size 25M;

    # Rate-limit on auth + webhook endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- n8n flows (basic auth gateway) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flows.asoftechinsightz.com;
    ssl_certificate     /etc/letsencrypt/live/flows.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flows.asoftechinsightz.com/privkey.pem;

    auth_basic           "AsoftechInsightz Flows";
    auth_basic_user_file /etc/nginx/.htpasswd_flows;
    # Generate: sudo htpasswd -c /etc/nginx/.htpasswd_flows admin

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
