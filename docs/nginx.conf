# AsoftechInsightz — Multi-domain Nginx reverse proxy
#
# Domain map:
#   asoftechinsightz.com              → Marketing website (Next.js :3000)
#   www.asoftechinsightz.com          → 301 → asoftechinsightz.com
#   app.asoftechinsightz.com          → Business Suite (Next.js :3000)
#   api.asoftechinsightz.com          → Business Suite API (Next.js /api/*)
#   app.observability360...           → Observability360 UI (:4000 or separate stack)
#   api-observability360...           → Observability360 API gateway (:4000)
#
# TLS: one Let's Encrypt cert on VPS covers marketing + suite (cert-name: app.asoftechinsightz.com):
#   asoftechinsightz.com, www.asoftechinsightz.com, app.asoftechinsightz.com
# Expand with: certbot certonly --nginx --expand --cert-name app.asoftechinsightz.com -d ... -d api.asoftechinsightz.com

upstream asoftech_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream observability_gateway {
    server 127.0.0.1:4000;
    keepalive 16;
}

# ---- Marketing: www → apex ----
server {
    listen 80;
    listen [::]:80;
    server_name www.asoftechinsightz.com;
    return 301 https://asoftechinsightz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;

    return 301 https://asoftechinsightz.com$request_uri;
}

# ---- Marketing website (apex) ----
server {
    listen 80;
    listen [::]:80;
    server_name asoftechinsightz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    # Suite paths on marketing host → app subdomain (belt-and-suspenders with Next middleware)
    location ~ ^/(dashboard|leadedge360|retailedge360|leads|opportunities|proposals|invoices|revenue|campaigns|analytics|settings|payments|onboarding|ops|subscribe|signin|signup|splash|product-selection|portal)(/|$) {
        return 301 https://app.asoftechinsightz.com$request_uri;
    }

    location /_next/static/ {
        proxy_pass http://asoftech_nextjs;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://asoftech_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- Business Suite (app) ----
server {
    listen 80;
    listen [::]:80;
    server_name app.asoftechinsightz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 25M;

    location /api/auth/ {
        proxy_pass http://asoftech_nextjs;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://asoftech_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- Business Suite API ----
server {
    listen 80;
    listen [::]:80;
    server_name api.asoftechinsightz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25M;

    location / {
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://asoftech_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host app.asoftechinsightz.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- Observability360 (existing cert: observability360 + api.observability360) ----
server {
    listen 80;
    listen [::]:80;
    server_name observability360.asoftechinsightz.com api.observability360.asoftechinsightz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name observability360.asoftechinsightz.com api.observability360.asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/observability360.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observability360.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 50M;

    location / {
        proxy_pass http://observability_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Future hostnames (issue cert after DNS is pointed):
#   app.observability360.asoftechinsightz.com
#   api-observability360.asoftechinsightz.com

