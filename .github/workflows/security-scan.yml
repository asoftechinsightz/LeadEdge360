name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Dependency audit
        run: node scripts/security/dependency-audit.mjs
        continue-on-error: true
      - name: OWASP verification
        run: node scripts/security/owasp-verify.mjs
