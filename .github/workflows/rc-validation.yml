# RC-2 — Sprint 1 validation pipeline (no deploy)
# Closes B-RC-01, B-RC-02, B-RC-05 automation gaps from RC-1.

name: RC-2 Validation

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  MONGO_URL: mongodb://localhost:27017
  DB_NAME: asoftech_saas_rc2
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  ENFORCE_PLAN_LIMITS: 'false'
  WEB_JWT_BRIDGE: 'false'
  AEO_SERVER_PROFILE: 'false'
  JWT_SECRET: rc2-test-secret
  N8N_WEBHOOK_TOKEN: rc2-test-webhook-token
  N8N_WEBHOOK_ORG_ID: demo-org
  ALLOW_PUBLIC_DEMO_ORG: 'true'

jobs:
  rc2-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: RC-2 automated suites (Mongo)
        continue-on-error: true
        id: rc_suites
        run: node scripts/rc-ci-runner.mjs

      - name: Production build
        run: yarn build

      - name: Record build success
        if: success()
        run: node scripts/rc2-append-results.mjs --build-ok

      - name: Record build failure
        if: failure()
        run: node scripts/rc2-append-results.mjs --build-fail

      - name: Docker image build
        run: |
          docker build -t asoftech-rc2:ci . \
            --build-arg MONGO_URL=mongodb://localhost:27017 \
            --build-arg DB_NAME=asoftech_saas_rc2 \
            --build-arg NEXT_PUBLIC_BASE_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            --build-arg JWT_SECRET=rc2-test-secret

      - name: Record docker success
        if: success()
        run: node scripts/rc2-append-results.mjs --docker-ok

      - name: Record docker failure
        if: failure()
        run: node scripts/rc2-append-results.mjs --docker-fail

      - name: Start app for API regression
        run: |
          PORT=3000 yarn start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/ >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: asoftech_saas_rc2

      - name: Install Python requests
        run: pip install requests

      - name: API regression (backend_test.py)
        run: RC_API_BASE_URL=http://localhost:3000/api python backend_test.py

      - name: Record API regression success
        if: success()
        run: node scripts/rc2-append-results.mjs --api-ok

      - name: Record API regression failure
        if: failure()
        run: node scripts/rc2-append-results.mjs --api-fail

      - name: Generate RC-2 reports
        if: always()
        run: node scripts/generate-rc2-reports.mjs

      - name: Upload RC-2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-validation
          path: |
            docs/releases/rc2-artifacts/
            docs/releases/RC2_*.md
          retention-days: 30

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then kill $(cat /tmp/next.pid) || true; fi

      - name: Final RC-2 gate
        run: |
          node -e "
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('docs/releases/rc2-artifacts/rc2-results.json','utf8'));
          const fail=d.summary.failedChecks>0 || d.build?.ok===false || d.docker?.ok===false || d.apiRegression?.ok===false;
          if(fail) process.exit(1);
          "
