name: asoftech_business_suite
description: Asoftech Business Suite — Android-first enterprise mobile app for LeadEdge360 & RetailEdge360.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  local_auth: ^2.3.0
  intl: ^0.19.0
  equatable: ^2.0.7
  connectivity_plus: ^6.1.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  google_sign_in: ^6.2.2
  razorpay_flutter: ^1.3.7
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  file_picker: ^8.1.7
  mobile_scanner: ^6.0.2
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/brand/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/brand/app_icon.png
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: assets/images/brand/app_icon_foreground.png
