# Gradle JVM — increase Metaspace for lint + multi-module Flutter builds (Windows).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# Skip release lint vital on low-memory Windows builds (lint still runs in CI/analyze)
android.lint.checkReleaseBuilds=false
android.lint.abortOnError=false

# Prefer HTTPS repositories only (default for google() / mavenCentral())
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
