global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: asoftech-app
    metrics_path: /api/metrics
    static_configs:
      - targets: ['app:3000']
    scrape_interval: 30s

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: health-probe
    metrics_path: /api/health/ready
    static_configs:
      - targets: ['app:3000']
    scrape_interval: 60s
