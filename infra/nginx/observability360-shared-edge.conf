# Shared edge nginx — Observability360 + AsoftechInsightz
# VPS path: /opt/observability360/infra/nginx/observability360.conf
# Certs: /opt/observability360/infra/nginx/certs/
#   observability → fullchain.pem + privkey.pem
#   asoftech      → asoftech-fullchain.pem + asoftech-privkey.pem

upstream obs360_web {
    server web:3000;
    keepalive 8;
}

upstream obs360_api {
    server api-gateway:4000;
    keepalive 8;
}

upstream asoftech_nextjs {
    server asoftech-app:3000;
    keepalive 8;
}

# ---- HTTP → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name observability360.asoftechinsightz.com api.observability360.asoftechinsightz.com
                asoftechinsightz.com www.asoftechinsightz.com app.asoftechinsightz.com api.asoftechinsightz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Observability360 UI ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name observability360.asoftechinsightz.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://obs360_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# ---- Observability360 API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.observability360.asoftechinsightz.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://obs360_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ---- AsoftechInsightz marketing ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name asoftechinsightz.com www.asoftechinsightz.com;

    ssl_certificate     /etc/nginx/certs/asoftech-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/asoftech-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location ~ ^/(dashboard|leadedge360|retailedge360|leads|opportunities|proposals|invoices|revenue|campaigns|analytics|settings|payments|onboarding|ops|subscribe|signin|signup|splash|product-selection|portal)(/|$) {
        return 301 https://app.asoftechinsightz.com$request_uri;
    }

    location / {
        proxy_pass http://asoftech_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- AsoftechInsightz Business Suite ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.asoftechinsightz.com;

    ssl_certificate     /etc/nginx/certs/asoftech-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/asoftech-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://asoftech_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- AsoftechInsightz API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.asoftechinsightz.com;

    ssl_certificate     /etc/nginx/certs/asoftech-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/asoftech-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://asoftech_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host app.asoftechinsightz.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
