# Production Nginx — Docker profile (single-host fallback).
# For multi-domain production, use host-level docs/nginx.conf instead.
#
# Domain map: docs/DOMAIN_ARCHITECTURE.md

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

upstream asoftech_app {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS certs: mount per-domain under /etc/letsencrypt/live/
# Prefer host nginx (docs/nginx.conf) for marketing vs suite split.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://asoftech_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.asoftechinsightz.com api.asoftechinsightz.com;

    ssl_certificate     /etc/letsencrypt/live/app.asoftechinsightz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asoftechinsightz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 25M;

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://asoftech_app;
    }

    location / {
        proxy_pass http://asoftech_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
